<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebMC — File Manager</title>
<meta name="theme-color" content="#7aa2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WebMC">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" sizes="192x192" href="pwa-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="pwa-icon-512.png">
<link rel="apple-touch-icon" href="pwa-icon-192.png">
</head>
<body>
<div id="statusbar-top">
  <span id="status-host">WebMC</span>
  <span id="status-info" data-i18n="statusInfo">Ctrl+O: Terminal · F10: Exit</span>
</div>
<div id="panels">
  <div id="panel-left" class="panel active-panel">
    <div class="panel-header">
      <span class="panel-title" id="title-left">/</span>
      <span class="panel-info" id="info-left">0 Einträge</span>
    </div>
    <div class="panel-colheaders">
      <span class="colheader col-name sort-header" data-sort="name" data-label="Name">Name ▲</span>
      <span class="colheader col-size sort-header" data-sort="size" data-label="Size">Size</span>
      <span class="colheader col-date sort-header" data-sort="date" data-label="Date">Date</span>
    </div>
    <div class="panel-listing" id="listing-left" tabindex="0"></div>
  </div>
  <div id="panel-divider"></div>
  <div id="panel-right" class="panel">
    <div class="panel-header">
      <span class="panel-title" id="title-right">/</span>
      <span class="panel-info" id="info-right">0 Einträge</span>
    </div>
    <div class="panel-colheaders">
      <span class="colheader col-name sort-header" data-sort="name" data-label="Name">Name</span>
      <span class="colheader col-size sort-header" data-sort="size" data-label="Size">Size</span>
      <span class="colheader col-date sort-header" data-sort="date" data-label="Date">Date</span>
    </div>
    <div class="panel-listing" id="listing-right" tabindex="0"></div>
  </div>
</div>
<div id="cmdline-wrapper">
  <span id="cmdline-prompt">$</span>
  <input type="text" id="cmdline-input" placeholder="Enter command..." spellcheck="false" autocomplete="off">
</div>
<div id="buttonbar">
  <button class="fn-btn" data-fn="help" title="Help"><span class="fn-key">F1</span> Help</button>
  <button class="fn-btn" data-fn="rename" title="Rename"><span class="fn-key">F2</span> Rename</button>
  <button class="fn-btn" data-fn="view" title="View"><span class="fn-key">F3</span> View</button>
  <button class="fn-btn" data-fn="edit" title="Edit"><span class="fn-key">F4</span> Edit</button>
  <button class="fn-btn" data-fn="copy" title="Copy"><span class="fn-key">F5</span> Copy</button>
  <button class="fn-btn" data-fn="move" title="Move"><span class="fn-key">F6</span> Move</button>
  <button class="fn-btn" data-fn="paste" title="Paste"><span class="fn-key">F6</span> Paste</button>
  <button class="fn-btn" data-fn="mkdir" title="Directory"><span class="fn-key">F7</span> Directory</button>
  <button class="fn-btn danger" data-fn="delete" title="Delete"><span class="fn-key">F8</span> Delete</button>
  <button class="fn-btn" data-fn="terminal" title="Terminal"><span class="fn-key">F9</span> Terminal</button>
  <button class="fn-btn" data-fn="exit" title="Exit"><span class="fn-key">F10</span> Exit</button>
</div>
<div id="statusbar-bottom">
  <span id="status-left">Help: F1</span>
  <span id="status-center" id="status-msg">Ready</span>
  <span id="status-right" id="status-path">~</span>
</div>

<!-- Terminal Overlay -->
<div id="terminal-overlay" class="hidden">
  <div id="terminal-bar">
    <span>Terminal</span>
    <button id="terminal-close">×</button>
  </div>
  <pre id="terminal-output"></pre>
  <div id="terminal-input-line">
    <span id="terminal-prompt">$</span>
    <input type="text" id="terminal-input" spellcheck="false" autocomplete="off">
  </div>
</div>

<div id="toast-container"></div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      console.log('SW registered:', reg.scope);
    }, err => {
      console.warn('SW registration failed:', err);
    });
  });
}
</script>
</body>
</html>
